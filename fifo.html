<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8dce8">
<title>حكايتنا يا مجدى ♡</title>
<style>
:root{
 --pink:#f7dce8; --pink2:#f2bfd4; --rose:#c56f91; --deep:#75465f;
 --cream:#fffaf7; --lav:#e9e0f5; --gold:#d8b879; --ink:#594653;
 --shadow:0 18px 50px rgba(151,92,121,.13);
}
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; color:var(--ink);
 font-family:"Tahoma","Arial",sans-serif;
 background:
 radial-gradient(circle at 12% 15%,rgba(255,255,255,.9) 0 2px,transparent 3px),
 radial-gradient(circle at 85% 25%,rgba(255,255,255,.8) 0 3px,transparent 4px),
 linear-gradient(145deg,#fff7fa 0%,#fbe7ef 42%,#f1eafa 100%);
 background-size:38px 38px,52px 52px,auto;
}
header{padding:34px 18px 12px;text-align:center}
.kicker{color:var(--rose);font-size:.9rem;letter-spacing:2px}
h1{font-size:clamp(2rem,6vw,3.8rem);margin:12px 0 8px;color:var(--deep)}
.subtitle{margin:0;color:#997386;font-size:1.05rem}
.wrap{width:min(1040px,92vw);margin:24px auto 60px}
.shell{
 background:rgba(255,250,247,.88); border:1px solid rgba(255,255,255,.9);
 border-radius:30px; padding:clamp(18px,4vw,38px); box-shadow:var(--shadow);
 backdrop-filter:blur(8px);
}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.counter{font-size:.9rem;color:#a06b83}
.progress{height:8px;background:#f3e5ec;border-radius:20px;overflow:hidden;flex:1;min-width:110px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#e7a9c3,#cbb8e8);border-radius:20px;transition:width .35s}
.chapter{
 min-height:330px;padding:clamp(20px,4vw,42px);
 background:linear-gradient(135deg,#fff 0%,#fff7fa 70%,#f7f1fb 100%);
 border:1px solid #f2dce7;border-radius:24px;position:relative;overflow:hidden;
}
.chapter:before{content:"♡";position:absolute;left:18px;top:0;font-size:7rem;color:rgba(231,169,195,.16);pointer-events:none}
.chapter h2{position:relative;margin:0 0 24px;color:#a85f7e;font-size:clamp(1.35rem,4vw,2rem)}
.story{position:relative;white-space:pre-wrap;line-height:2.15;font-size:clamp(1.05rem,2.3vw,1.25rem);color:#5f4b57}
.story:empty:after{content:"♡";color:#d99bb6}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.navbtn,.chapter-btn{
 border:0;cursor:pointer;font:inherit;transition:transform .2s,box-shadow .2s,background .2s;
}
.navbtn{padding:12px 22px;border-radius:999px;background:#f0d2e0;color:#77485f;font-weight:bold}
.navbtn.primary{background:linear-gradient(135deg,#d98eae,#c5a9df);color:white;box-shadow:0 8px 20px #d8b4c9}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.navbtn:not(:disabled):hover,.chapter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(151,92,121,.16)}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:24px 0 4px}
.chapter-btn{
 width:42px;height:42px;border-radius:50%;background:#f8e8ef;color:#96627b;
 border:1px solid #efd2df;font-weight:bold;
}
.chapter-btn.active{background:linear-gradient(135deg,#d98eae,#c4afe0);color:#fff;border-color:transparent}
.chapter-btn.done{background:#eadff2;color:#8d6a9d}
.note{text-align:center;color:#a17d8e;font-size:.88rem;margin-top:20px}
footer{text-align:center;color:#b17d96;padding:0 18px 32px;font-size:.9rem}
.hearts{font-size:1.2rem;letter-spacing:8px;color:#d68eaa;margin:14px}
@media(max-width:560px){.chapter{min-height:400px}.controls{justify-content:center}.controls .navbtn{flex:1}}
</style>
</head>
<body>
<header>
 <div class="kicker">حكاية مكتوبة بالقلب</div>
 <h1>حكايتنا يا مجدى ♡</h1>
 <p class="subtitle">14 محطة… وكل محطة فيها ذكرى وحب</p>
 <div class="hearts">♡　✧　♡　✧　♡</div>
</header>
<main class="wrap">
 <section class="shell" aria-label="قصة الحب">
  <div class="topline">
   <span class="counter" id="counter">الجزء 1 من 14</span>
   <div class="progress"><span id="progress"></span></div>
  </div>
  <article class="chapter">
   <h2 id="chapterTitle"></h2>
   <div class="story" id="storyText"></div>
  </article>
  <div class="controls">
   <button class="navbtn" id="prev">السابق</button>
   <button class="navbtn primary" id="next">الجزء التالي ♡</button>
  </div>
  <nav class="dots" id="chapterButtons" aria-label="اختيار جزء من القصة"></nav>
  <p class="note">اختاري أي قلب باش ترجعي للذكرى اللي تحبيها ♡</p>
 </section>
</main>
<footer>صُنعت بكل الحب… عيد ميلاد سعيد مجدى · 22 ♡</footer>
<script>
const chapters = [{"title": "أول رسالة… وأول حكاية", "body": "هاي مجدى هذا ميساج اني نكتب فيه نهار 25 سبتمبر 2026 معلبليش شحال نبقى نكتب فيه من يوم مهم\n\nيلحقك نهار 25 نوفمبر 2026 على 00:00\n\nراح نكون اول واحد يقولك عيد ميلاد سعيد 🎂\n\nومل عام ونتي بخير وبصحة والهنا راح يولي عندك 22 عام مشي 22 سنة\n\nكاين فرق كبير بين عام والسنة نخليك نتي تحوسي عليه\n\nدخلت حياتك كي كان عندك 19 عام نهار 13 اكتوبر 2023\n\nهذاك نهار هو وين عرفتك واول مرة حكينا بريفي فيها وكنتي اول طقلة حكيت معاها بريفي وطولت وانا نحكي معها واكنةو بزاف يمات شبين ومكنتش داير فبالي بلي حا نولو مع بعضانا هكا\n\n14 نوفمبر 2023 درنا فيها theme تع bubbel tea وكان بزاف شباب وكيوت ومزلنا دايرينو وقتيلي نتزوجك نرمال نهار دابزنا مع يوسف 😂\n\nوراها ب 3 ايام 17 نوفمبر جوايه 18 تع حشية كنا نحكو قلتيلي نجيب اسمع ضك حنا شكون انا ونتا مفهمتش قتلك كفاه قتلي كوبل صحاب نحكو برك وانا من هاذ 3 بقات عيني على كوبل بسك كنتي بزاف عاجبتني قبل منحكو اصلا فقروب وكي سقسيت قالولي نن راهي مع واحد قلت خلاص"}, {"title": "تفاصيل صغيرة صارت ذكرى", "body": "انا قتلك كوبل قتيلي علابالك بلي عندي شحال وانا نحبك خفت نقولك وانا عجبني حالل بزاف بسم علابالي بلي نتي هي لي تكمليني ونكملك\n\nفاتو اليامات لحق انيفارسار تعك لول قتلك كل عام ونتي بخير ومنا وفرحتي بزاف\n\nوكنت نحبك بزافف وكل يوم نزيد نتعرف عليك مليح حتى لحقت عشقتك\n\nمكانش يهمني وش درتي من قبل ولا وش غلطتي بسك كل واحد فينا يجوز على حاجات هكا فحياتو 25 نوفمبر مجدى دارت 19 عام 🥳 وكانت بزاف فرحانة\n\nجوزنا يامات شبان حكينا على حياتنا حكيتلي على حياتك وش درتي وش جوزتي وانا مع كل كلمة تقوليها نزيد نفرح كي راكي معايا حكيتلي على فاميلتك وكانو بزاف يعجبوني حكاياتك"}, {"title": "كيف بدا الإعجاب؟", "body": "ونحب نسمعلك بزاف\n\nجازو الايام\n\nولينا نحكو على وش نحبو وعرفت بلي نتي تحبي تقراي كتابات بزاف وتعشقي القصص\n\nكما ايرا فاديتا\n\nمتمرد وبزاف وحدخرين\n\nوانا ثان نقرى كتابات وقتلك بلي نقرى بصح نقرى حاجات علمية نحب نتعلم صوالح جدد ونسيي بزاف حاجات ونحب نتعلم ونكون مليح فكل حاجة نعرفها\n\nلحق عام 2025 كان عام شباب درنا فيه بواف حاجات كنا نحكو ليزابال بزاف كام نخكو نهار كامل وليفلام فسناب مجدى تمشط مجدى دير ليماسك مجدى توحد وانا نشوف ليفلام على انو قصة كل لكمة نتمعن فيها\n\nوكل تفصيلة نشوفها حبيتك بزاف بالاك تقزلي حبيتني بيسك اول مرة لالا مجدى انا منحبش وخلاص وايلا خليت واحد يدخل حياتي اعرفي بلي هو بزاف يعنيلي فهاذ دنيا جازو يمات شبان بصح مكناش نتلاقاو فاصح كنت حاب نتلاقاك هذاك عام مي كنت خايف منعجبكش قلت خلي نهار وحدوخر كان عمري 16 سنة كنت مزال صغير ومجدى كبيرة عليا كفاه تحبني وان طفل صغير مجدى قالتي حبيتني بصح تكبر وتتبدل عقليتك قتلها نجيب يبقى نجيب مهما جازو عوام وسنين ونفكرك كاين فرق بيم عام وسنة حبيتك بزاف سييت ندير كل حاجة تحبيها وكل حاجة تقوليها كي نخكو ابال نتنعن فكل حاجة تحبيها ولا حاجة لي تذايقك نبعد عليها كنت نخبي بزاف حاجات فقلبي بسك مكنتش مامن بلي تحبيني صح بالاك وقت وتبلوكيني حبيتك بزاف حاولت نمد كل حاجة مليحة ليك عطيتك كلش واي حاجة تحبيها كنت نسيي نديرها بش نفرحك"}, {"title": "أول عيد ميلاد نحكيو عليه", "body": "عشقتك مجدى كنت نشزف فيك نتي هي كلش ومزالك للضك نتي كلش ونشوفك دنيتي"}, {"title": "حكاياتك اللي نحب نسمعها", "body": "وحياتي\n\nلحق سنة 2025 كانت سنة شوي صعيب بصح فتناه مجدى دارت فيه 21 عام 2025 جوجو عندو لباك ومجدى طلعت للجامعة وكان اول عام ليها\n\nدرنا بزاف حاجات فهذي المدة سيينا دي بروجي الورد كخوشات وكنا نسيو دايمن نتقدمو لحاجة وننجحو زعفنا كرهنا دابزنا تقلقنا بصح جزنا ملش مع بعض وخاجة ما أثرت فينا معليش هذي سنة جوجو مجابش لباك ومجدى مطلعتش لعام زعفنا وكرهنا بصح مفشلناش\n\nلحق نهار 30 اكتوبر 2025 كان فيه معرض كتاب قبلها بنهار فليل قتلك نتلاقاو غدوة كفاه ومنا جات هيدا برك كان فقلبي نشوفك برك مكنت موجد والو مجبتلك والو هذاك نهار سمحيلي\n\nكان فبالي انو نشوفك برك تلاقينا كنا خايفين حشمانين شفتك من بعيد مأمنتش بلي هذيك نتي كفاه زين هذا كامل يحبني انا وليت لباليىقلت نشاله يفوت نهار شباب هذاك يوم شديتك قتلك نحبك كلينا مشبنا درنا درنا بزاف حاجات محدى جابتلي كادو ومأمنتش بلي جبتيلي جامي واحد درلي كما نتي فرحت بزاف معرفتش وش نقولك من داخلي كنت ميت بالفرحة بصح زعفان كي مجبت والو انا هذيذ ليلة بقينا نحكو لى نهارنا وش درنا وكنا فرحانين وخلاص لثم محدى تحبني وانا نحبها واي حاجة تطلبها نديرها مهما يصرى خلاص رتحت لكلش هذاك نهار"}, {"title": "عام مليان ضحك وتفاصيل", "body": "فاتو ليام محدى لحق عيد ميلادها ودارت 21 عام كتبتلها ميساج طويل عجبها بزاف فرحت بيه وكنت حاب نحظر للنهار هذاك بصح مكتبتش مجدى دارت انيفرسار مع منال وصاحبها وجاز نهار شلاب بزاف\n\nعام 2025 مجدى راحت لالمان ودارت بزاف حاجات فيه زجابلها باباه طونوبيل بصحتك تستاهلي مكثر حبيتك بزاف"}, {"title": "حبيتك أكثر مع كل يوم", "body": "عام 2025 جوزنا فيه بزاف حاجت مليحة وعيانة وكان عام فيه بزاف صوالح بصح افضل حاجة كي شفتك وشفتيني\n\nلحق عام 2026 مجدى وجوج عاودو لعام تع قرايو وخلاص هذا لعام عامنا وننجحو قرينا فيه مليح وبش تعرفي بلي نجحنا\n\nقرينا فيه وخدمنا على بزاف حاجات لبروجي تع حوايج الورد وبزاف حاجت مجدى دارت لي انفروماسيو تع قاطو ودارت حاجات بزاف\n\nعام 2026 نجحنا فيه مجدى طلعت عامها وجوجو جاب لباك فرحتلك كثر ملي فرحت للباك بسك قريتي وعييتي ومجدى اي خاجة ديرها تنجح فيها ومأمن بلي اي حاجة تحبي ديريها تنجحي فيها حبيتك بزاف\n\nعام 2026 مزال مخلاصش ومزال نديرو بزاف حاجات ك رانا فبروجي تع بلانر ومكملين فيه مهما يصرى"}, {"title": "أحلامنا ومحاولاتنا", "body": "فواش كتبتلك كامل ❤️ حبيت نقولك مجدى نتي اول حب ليا واخر حب ليا فهاذ دنيا كامل\n\nنحبك ونعشقك ونتي هي حياتي ونتي هي لي نهرب ليها كي تضيق بيا صبتك فكلش عاونتيتي\n\nفبزاف حاجات\n\nحبيتك بزاف ونحب ندير معاك كلش\n\nمجدى حياتي بدات نهار عرفتك وملي عرفتك وانا فرحان كل ما نكره نعرف بلي كاين مجدى فحياتي تحبني ونحبها\n\nمجدى مكاين حتا طفلة تعوضك\n\nنتي نتي حياتي وبنتي ومرتي ودنيتي نحبك نتي برك ونتي عشقي وانا وليدك وكل حاجة فيا ليك وكل خاجة تحبيها قوليلي عليها\n\nمجدى جامي نخليك وحدك جامي نكرهك جامي نشبع منك\n\nمجدى سمحيلي الا درت غلطات فحياتنا الا زعفتك نهار الا خبيت عليك سمحيلي وكل حاجة غلطة فيها نسيي نصححها\n\nحياتي نحبك وراني مسامحك فكل حاجة وجامي"}, {"title": "نهار التقينا لأول مرة", "body": "نكرهك مهما ديري\n\nصح درنا بزاف حاجات غالطين بصح نحب ندير معاك كلششظ\n\nمجدى مزالت قدامنا حيات طويلة وكبيرة ومزلنا صغار ونديرو كلش وننجحو منسيتش نهار واحد جاز علينا مجدى مل لحظة نتفكرها نفرح بزاف انو اني معاك صح درنا بزاف حاجات غالطين بصح نحب ندير كلش معاك عرفنا بعضانا ثدفة وليتي افضل صدفة فحياتي كامل هنا اني نكتب مور ما تلاقينا للمرى 2 بالاك فوق مكتبتلكش بلي تلاقينا كان نهار بزاف شباب لينا ك اني نكتب ليوم رانا 15 اكتوبر راهي 3 تع صبح راحتلي انترنت وتوحشتك\n\nنهار لي تلاقينا كان افضل نهار كامل مكناش حشمانين مكناش خايفين صخ مصبناش وين نروحو بصح سلمت عليك شديتك عنقتك نص وكانت افضل حاجة صح منكذبش كنت حاب نعنقك ونعطيك بيزوووو 🥺 يصح مكانش وين مجدى كنتي زلة بزاااف هذاك نهار صح كنتي تقعري كنا نمشو نتي تحكي وانا غارق فعينيك وزينك اخخخخ شحال كنت حاب ناكلك هذاك نهار كلينا مع بعض ضريتلك حاجة تبقالك ليك ومزال نزيد نجيبلك بزاف حاجات صح مهيش هذيك حاجة واو بصح عجبتني بزاف وخاجة لي قعرتني انو كنا لابسين ماتشييي يوووه كنا بزاف كيوت والله حبيتك بزاف"}, {"title": "هدية ما ننساهاش", "body": "اذا تلاقينا نهار المعرض باينة راح نحكيلك نحبك\n\nهاي ليوم 4 نوفمبر مشكيتش حا نتلاقاو سمحيلي بزاف كي متلاقيناش كنت حاب منلقاو والله\n\nهيلوووو عشقي نشاله تكوني مليحة فخياتك او نشاله تكوني فرحانة فواش رانا نخدمو\n\nليوم 9 نوفمبر راهي 17:19 ميرا نحبك ليوم نهار كامل نخمم نشاهل تكون فوتت بحث تعها مليح وقرات مليح بيسك تعبت بزاف وكان لازم عليا نبقى معاها ايا انا رقدت ديركت 🙂"}, {"title": "عام جديد ونجاحاتنا", "body": "ايه صح عباااللك شحححال فرحتتتتت ب ايفون لي جبتيه بزااف بزاف حاي كيوت شبااب يوالنك بزاف يديك هكا صغيورين كيوتت يجي هايلل فيدك وكي تخدمي بيه بزاففف والله\n\nكل دقيقة كل ساعة كل نهار كل شهر كل عام كل مرة نزيد نتأكد بلي نحبك ونحبك بزاف تع بزاف حياتي صح منيش كما تحبي نتي منجيبلك والو منشريلك منتلاقاو دايما صح سمحيلب بزاف على هذي\n\nمجدى والله صح نحبك وحاب ندير كلش معاك نخدمو نعياو بش نلحقو وين حابين مام منكونوش لبعضانا مهم واحد فبنا يعيش وش كان حاب او وش كان يحلم هذي لحاجة لي تخمني صح يامات هذو مناش كما كنا مناش نحكو بزاف منيش عارف بالاك اكي دايرة حاجة فرلصك مش حابة تقوليها حياتي بصح والله لا نحبك ا ميرى مش لازم تحكيلي كلش ثح نخب نسقسيك ونعرف بش متحسيش روحك وحدك مي ادا مش حابة تحي والله عادي كون تقولي جوجو مش حابة نهدر فهاد حاجة والله نحب كي يكون بيناتنا هكا تفاهم تع مش حاب نحكي فهادي ولا هادي"}, {"title": "حتى في الأيام الصعيبة", "body": "ايا نحكو فحاجة اخرى\n\nمامتون نحب نحكي معاك ونجي من لافاك نلهف بش نبعثلك ولا نصيبك باعثتلي نهار كامل نخمم فيك وينها راهي صفا وش خصها وش لي عياها وش لي كرهت منو فواش تخمم كي تكون وحدها بزاف حاجات صح كاين حاجات بزاف نغير منهم ونغير بزاف عليك انا هكا ميرى نحبها انا مكاش لي يدنا ليخا ولا يداصرها ولا يحكي معاها فأي حاجة ابار حاجة تع قرايا صح نحبك هي نرمالمون مساج هذا ميكونش فيه حاجات هكا بصح والله كي ندخل نوت نزلي نكتب وخلاص ميهمنيش وش فيه نهم نحكيي ونقول وش عندي منينذاك نجي نحكي معاك فبزاف حاجات هكا نسقسيك منا وش نديرو نصببك شغل مش حابة تحكي ولا تحكي بالبارد نقول اوك منزيدش عليخا بالاك اي عيانة وعلابالي تقولي نن واحكي عادي مي كاين حاجات نشوفهم تع مهيش هذحابة تهدر حابة تقعد شوي وحدها"}, {"title": "كلام من القلب", "body": "حياتي اعرفي بلب اني نحكيلك والله العلي العظيم مني نلوم فيك فاي حاجة صراة وجامي نلومك على حاجة درتيها من قبل ولا حتى كون ديري منلومكش علاش بيسك ما يهمنيش كي نخمم فحاجة تعيني مجدى نحبها نديير كل حاجة هبا تحبها ونبعد على كل حاجة تخليها تخمم فحوايج عيانين جامي جاتني فراصي تع نخليك ولا نروح كامل صح جات فترة رحت بيسك كنت مرنك كامل من تخمام مي دك يصرى وش يصرى منروحش الا اذا نتي حبيتي حياتي سمحيلي على اي حاجة غالطة درتهالك ملي تعرفنا فري نحبك ومننجمش بلا بيك مجدى نتي كلش ليا فحباني وبنيت معاك كلش وخططة لكلكش معاك كتبت بزااف وطولت وانا نكتبب ميم زال نزيد نكتبلك بنتي منكذبش عليك ونقول نعرفك مليح تع صح ونهرف كلش عليك كفاه تخمي مزالني نزيد نتعلم كفاش تخمي مليح وش ديري ومنا ومنا ومع تالي اليوم راه 22 نوفمبر 2026 الوقتتت راه 1:15 تع صبح اليوم صح محكيناش علابالي بلي بنتي اي مريضة حبيت نقولك مجدى مجدى مكيش مجرد طفلة عرفتها نتي هي لي نحبها نتي هي لي نعشقها نتي هي لي حاب نكمل حياتي معاها نتي هي لي حاب نشوفها كل منوض من رقاد نتي هي لي جاب نعيش معاها كل حاجة خممنا فيها نتي حبي لول والتالي حبيتك بزاف مجدى"}, {"title": "عيد ميلادك… وحكايتنا ما زالت", "body": "عيدميلاد سعيد وكل عام وحنا مع بعضانا🥳🫂❤️"}];
let current = 0;
const title = document.getElementById('chapterTitle');
const story = document.getElementById('storyText');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const buttons = document.getElementById('chapterButtons');

chapters.forEach((chapter, i) => {
 const b = document.createElement('button');
 b.className = 'chapter-btn';
 b.type = 'button';
 b.textContent = String(i + 1);
 b.title = chapter.title;
 b.setAttribute('aria-label', `الجزء ${i+1}: ${chapter.title}`);
 b.addEventListener('click', () => showChapter(i));
 buttons.appendChild(b);
});
function showChapter(i){
 current = Math.max(0, Math.min(chapters.length - 1, i));
 title.textContent = chapters[current].title;
 story.textContent = chapters[current].body;
 counter.textContent = `الجزء ${current+1} من ${chapters.length}`;
 progress.style.width = `${((current+1)/chapters.length)*100}%`;
 [...buttons.children].forEach((b,j)=>{
   b.classList.toggle('active',j===current);
   b.classList.toggle('done',j<current);
   b.setAttribute('aria-current',j===current?'step':'false');
 });
 prev.disabled = current===0;
 next.textContent = current===chapters.length-1 ? 'نهاية حكايتنا ♡' : 'الجزء التالي ♡';
 next.disabled = current===chapters.length-1;
}
prev.addEventListener('click',()=>showChapter(current-1));
next.addEventListener('click',()=>showChapter(current+1));
showChapter(0);
</script>
